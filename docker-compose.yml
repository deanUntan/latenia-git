version: '3.8'

services:
  # ── Web Application (PHP-FPM + Nginx) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-base64:3d1Jd7rGfH5/oKpB9L8d7F6gH5j4k3l2m1n0oPqRsTu=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-latenia_gis}
      DB_USERNAME: ${DB_USERNAME:-latenia_user}
      DB_PASSWORD: ${DB_PASSWORD:-latenia_password}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      - db
    ports:
      - "80:80"

  # ── Database (MySQL) ──
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-latenia_gis}
      MYSQL_USER: ${DB_USERNAME:-latenia_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-latenia_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  storage-data:
  db-data:
